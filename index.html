 if(x.t=='T')return `<p class="v ${x.a=='True'?'ok':'no'}">${x.a}</p>`;
 if(x.t=='M')return `<ol class="o">${x.a.split('¦').map((o,i)=>`<li class="${'ABCD'[i]==x.k?'c':''}">${hl(o)}</li>`).join('')}</ol>`;
 if(x.t=='C')return `<p class="v ok">${hl(x.a)}</p><p class="fill">${esc(x.q).replace(/_{3,}/g,'<b>'+esc(x.a)+'</b>')}</p>`;
 const p=x.a.split('¦'),notes=p.filter(t=>/^Note:/.test(t)),m=p.filter(t=>!/^Note:/.test(t));
 return `<ol class="al${m.length<2?' one':''}">${m.map(t=>`<li>${S.inc?hl(t):esc(t)}</li>`).join('')}</ol>${notes.map(t=>`<p class="note">${S.inc?hl(t):esc(t)}</p>`).join('')}`}

function item(x){
 const open=S.term&&hit(x,S.term)==2&&!hit({...x,a:'',t:'T'},S.term)?' open':'';
 return `<details class="q"${open}><summary><span class="n">${x.n}</span><span class="ty ${x.t}">${TY[x.t]}</span><span class="qt">${hl(x.q)}</span><span class="ls">L${lesson[x.n]}</span></summary><div class="a">${ans(x)}</div></details>`}

function render(){
 re=S.term?new RegExp('('+S.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'):null;
 const tabs=[['All',Q.filter(x=>ok(x,1)).length],...LS.map((l,i)=>[l[0],Q.filter(x=>ok(x,1)&&lesson[x.n]==i+1).length])];
 $('#tabs').innerHTML=tabs.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="${S.tab==i}">${t[0]}<b>${t[1]}</b></button>`).join('');
 const types=[['all','All types'],['T','True / False'],['M','Choose'],['C','Complete'],['A','Answer']];
 $('#types').innerHTML=types.map(t=>`<button data-y="${t[0]}" aria-pressed="${S.type==t[0]}">${t[1]}</button>`).join('')+'<button class="tog" id="tog">Show / hide all answers</button>';
 const r=Q.filter(x=>ok(x));
 $('#list').innerHTML=`<p class="meta">${r.length} question${r.length==1?'':'s'}${S.term?` matching “${esc(S.term)}”`:''}</p>`+(r.length?r.map(item).join(''):'<p class="empty">No questions match your search.</p>')}

$('#q').oninput=e=>{const v=e.target.value.trim();if(v&&!S.term)S.tab=0;S.term=v;render()};
$('#inc').onchange=e=>{S.inc=e.target.checked;render()};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]'),y=e.target.closest('[data-y]');
 if(t){S.tab=+t.dataset.t;render()}
 else if(y){S.type=y.dataset.y;render()}
 else if(e.target.id=='tog'){const d=[...document.querySelectorAll('details.q')],any=d.some(x=>!x.open);d.forEach(x=>x.open=any)}});
render();
</script>
</body>
</html>
